plugins { id 'com.android.application' }

android {
    namespace 'com.lunce.soundmanager'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lunce.soundmanager'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    signingConfigs {
        release {
            if (System.getenv('SM_KEYSTORE_PATH')) {
                storeFile file(System.getenv('SM_KEYSTORE_PATH'))
                storePassword System.getenv('SM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SM_KEY_ALIAS') ?: 'soundmanager'
                keyPassword System.getenv('SM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('SM_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    sourceSets { main { assets.srcDir '../../licenses' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
