name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: dotnet build SoundManager.sln -c Release
      - run: dotnet test tests/SoundManager.Tests -c Release --no-build
      - run: dotnet test tests/SoundManager.Windows.Tests -c Release --no-build
      - run: node --test browser-extension/tests/*.test.js
      - name: Install isolated browser test runtime
        working-directory: browser-extension
        run: |
          npm ci
          npx playwright install chromium
      - name: Verify real tab audio capture
        timeout-minutes: 5
        working-directory: browser-extension
        run: npm run e2e
      - run: dotnet publish src/SoundManager.Windows -c Release -r win-x64 --self-contained true -o artifacts/windows
      - shell: pwsh
        run: ./scripts/prepare-tunnel.ps1
      - shell: pwsh
        run: ./scripts/prepare-browser.ps1
      - shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify standalone EXE extraction
        shell: pwsh
        run: |
          $exe = (Get-ChildItem artifacts/release/*/*-windows-x64.exe | Select-Object -First 1).FullName
          $target = Join-Path $PWD 'artifacts/exe-check'
          $process = Start-Process -FilePath $exe -ArgumentList '--extract-only',$target -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'EXE extraction failed' }
          foreach ($name in @('SoundManager.Windows.exe','SoundManager.Windows.dll','cloudflared.exe','browser-extension/manifest.json','browser-extension/offscreen.js')) {
            if ((Get-FileHash "artifacts/windows/$name").Hash -ne (Get-FileHash "$target/$name").Hash) { throw "File mismatch: $name" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SoundManager-Windows-x64-EXE
          path: artifacts/release/*/*-windows-x64.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: SoundManager-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
