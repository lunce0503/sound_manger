name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SoundManager.sln -c Release
      - run: dotnet test tests/SoundManager.Tests -c Release --no-build
      - run: dotnet publish src/SoundManager.Windows -c Release -r win-x64 --self-contained true -o artifacts/windows
      - shell: pwsh
        run: ./scripts/prepare-tunnel.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SoundManager-Windows-x64
          path: artifacts/windows/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: SoundManager-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
