[workspace]
members = ["crates/sound-core", "crates/sound-protocol", "crates/sound-server", "crates/sound-output", "crates/sound-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util", "io-std"] }

[profile.release]
lto = "thin"
codegen-units = 1
